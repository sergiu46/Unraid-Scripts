# Headers
proxy_set_header Host $host;
proxy_set_header X-Original-URL $scheme://$http_host$request_uri;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $http_host;
proxy_set_header X-Forwarded-URI $request_uri;
proxy_set_header X-Forwarded-Ssl on;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Real-IP $remote_addr;

# Basic Proxy Configuration (tuned for <= 5 users)
server_tokens off;
proxy_next_upstream error timeout invalid_header http_500 http_502 http_503;
proxy_redirect http:// $scheme://;
proxy_http_version 1.1;
proxy_cache_bypass $cookie_authelia_session;
proxy_no_cache $cookie_authelia_session;
proxy_buffering off;
proxy_request_buffering off;
proxy_max_temp_file_size 0;
sendfile on;
tcp_nopush on;
tcp_nodelay on;

# Trusted Proxies Configuration
set_real_ip_from 172.19.0.0/16;
set_real_ip_from 172.18.0.0/16;
set_real_ip_from 172.17.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# Advanced Proxy Configuration
send_timeout 5m;
proxy_read_timeout 360;
proxy_send_timeout 360;
proxy_connect_timeout 360;

# WebSockets & Compression
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection "Upgrade";
gzip off;

# Uploads
client_body_buffer_size 2000M;
client_body_temp_path /data/body_temp 1 2;
client_max_body_size 1000000M;

# Security
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=(), usb=(), clipboard-read=(self), clipboard-write=(self)" always;